# Configuration for the AdvancedTransactionCategorizationModel

# --- Flags ---
use_sequence_encoder: false # Set to true to enable TFT/Sequence encoder
use_graph_encoder: true     # Set to true to enable HGT/Graph encoder
use_text_encoder: true      # Set to true to enable FinBERT/Text encoder

# --- General Parameters ---
user_embed_dim: 64        # Dimension for the user ID embeddings
max_seq_length: 50        # Max sequence length considered by the sequence encoder (used in DataModule)

# --- Graph Encoder (HGT) Parameters ---
graph_encoder_params:
  encoder_type: 'hgt'      # Identifier (if you have multiple GNN types)
  # in_channels: {}        # Automatically populated by DataModule based on node features
  hidden_channels: 128     # Internal dimension of HGT layers
  out_channels: 128        # Final output dimension of the GNN embedding
  num_heads: 4             # Number of attention heads in HGT layers
  num_layers: 2            # Number of HGT layers (should match DataModule's num_hgt_layers)
  # metadata: []           # Automatically populated by DataModule

# --- Sequence Encoder (TFT Wrapper) Parameters ---
sequence_encoder_params:
  encoder_type: 'tft'
  output_dim: 128          # Desired final output dimension of the sequence embedding (after potential projection)
  embedding_source_key: 'encoder_variables' # Key in TFT output dict to use as embedding (check pytorch-forecasting docs for options)

  tft_params: # Parameters passed directly to pytorch-forecasting TemporalFusionTransformer
    # --- Core TFT Parameters (Adjust as needed) ---
    hidden_size: 64            # Hidden layer size within TFT
    lstm_layers: 1           # Number of LSTM layers (can be 1 or 2)
    num_heads: 4             # Number of attention heads
    dropout: 0.1             # Dropout rate

    # --- Boilerplate Required by TFT ---
    output_size: 1             # Required, but not directly used for embedding if embedding_source_key is different. Set to 1.
    # Loss function is required for TFT init. Use a placeholder.
    # NOTE: The *actual* training loss is handled by FocalLoss in the main Lightning model.
    # If using 'QuantileLoss()', add 'from pytorch_forecasting.metrics import QuantileLoss' to train_new.py
    loss: "MAE_placeholder" # New placeholder string

    # --- Feature Configuration (CRUCIAL: Match DataModuleV2 output) ---
    # Explicitly tell TFT there are NO categorical features of any kind.
    static_categoricals: []
    static_reals: []
    time_varying_known_categoricals: []
    time_varying_known_reals: []
    time_varying_unknown_categoricals: 
      - 'region_id'

    # List the **names** of the real-valued features generated by DataModuleV2's
    # _prepare_and_add_sequences method, in the correct order.
    # The current DataModuleV2 creates: [amount, day_sin, day_cos, hour_sin, hour_cos, time_delta_scaled] (assuming the last one is scaled)
    time_varying_unknown_reals:
      - 'amount'
      - 'day_sin'
      - 'day_cos'
      - 'hour_sin'
      - 'hour_cos'
      - 'time_delta_scaled' # Make sure this name matches the feature generation logic

    # --- Groups & Embedding Sizes for Categoricals ---
    # Define cardinality (placeholder, will be updated in train_new.py)
    # categorical_groups: {
    #   'region_id': 0 # Placeholder Cardinality for region_id
    # }
    # Define embedding dimension for the categorical feature
    # embedding_sizes: {
    #   'region_id': 10 # Example embedding dimension for region_id (adjust as needed)
    # }
    # Other optional params (defaults are often sufficient if only encoding)
    # embedding_paddings: []

# --- Text Encoder (FinBERT) Parameters ---
text_encoder_params:
  model_name: 'ProsusAI/finbert'  # Or 'bert-base-uncased', etc.
  max_length: 128                 # Max token length for tokenizer
  projection_dim: 128             # Project FinBERT output (768) to this dim? (0 = no projection)
  freeze_bert: true               # Freeze base BERT layers during training?

# --- Fusion Module Parameters ---
fusion_params:
  # graph_dim: 128    # Automatically populated from graph_encoder_params['out_channels']
  # seq_dim: 128      # Automatically populated from sequence_encoder_params['output_dim']
  # text_dim: 128     # Automatically populated based on text_encoder_params
  # user_dim: 64      # Automatically populated from user_embed_dim
  hidden_dim: 128     # Hidden dimension within the fusion module
  output_dim: 256     # Final dimension after fusion, before classification heads
  dropout: 0.1
